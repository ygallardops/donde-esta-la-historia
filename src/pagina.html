<!DOCTYPE html>
<html lang="es-PE">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --texto: #1f2328; --suave: #59636e; --borde: #d0d7de; --fondo: #f6f8fa; --superficie: #ffffff;
    --primario: #0b5cad; --primario-oscuro: #084a8c;
    --ok: #1a7f37; --ok-fondo: #dafbe1; --error: #b42318; --error-fondo: #fee4e2;
    --radio: 8px;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--texto); background: var(--fondo); }

  header { background: var(--superficie); border-bottom: 1px solid var(--borde); padding: 12px 16px 0; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  [role=tablist] { display: flex; gap: 4px; overflow-x: auto; }
  [role=tab] { font: inherit; background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 14px; color: var(--suave); cursor: pointer; }
  [role=tab][aria-selected=true] { color: var(--primario); border-bottom-color: var(--primario); font-weight: 600; }

  .contenido { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; padding: 16px; max-width: 1100px; margin: 0 auto; }
  body[data-pestana=consultas] .contenido { grid-template-columns: minmax(0, 1fr); }
  body[data-pestana=consultas] .lateral { display: none; }
  @media (max-width: 860px) { .contenido { grid-template-columns: minmax(0, 1fr); } }
  @media (max-width: 480px) {
    header { padding: 12px 8px 0; }
    [role=tab] { padding: 8px 8px; font-size: 15px; }
    .contenido { padding: 8px; }
  }

  .panel, .tarjeta { background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--radio); padding: 16px; }
  .lateral { display: flex; flex-direction: column; gap: 12px; align-self: start; }
  .tarjeta h2 { font-size: 15px; margin: 0 0 8px; }

  #mensaje { margin: 0 0 12px; padding: 8px 12px; border-radius: var(--radio); min-height: 2.6em; border: 1px solid transparent; }
  #mensaje:empty { visibility: hidden; }
  #mensaje.ok { background: var(--ok-fondo); border-color: #aceebb; }
  #mensaje.error { background: var(--error-fondo); border-color: #fecdca; }

  label { display: block; font-size: 14px; color: var(--suave); }
  label > input, label > select { display: block; margin-top: 4px; }
  input, select { font: inherit; color: var(--texto); width: 100%; padding: 8px 10px; border: 1px solid var(--borde); border-radius: 6px; background: var(--superficie); }
  input:focus-visible, select:focus-visible, button:focus-visible, [role=tab]:focus-visible { outline: 3px solid #80b3ea; outline-offset: 1px; }
  fieldset { border: 0; padding: 0; margin: 0 0 16px; }
  legend { font-weight: 600; margin-bottom: 8px; }
  .ayuda { font-size: 14px; color: var(--suave); margin: 8px 0 0; }
  .campos { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; align-items: end; }

  .entrada-numero { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
  .entrada-numero label { flex: 1 1 220px; color: var(--texto); font-weight: 600; font-size: 15px; }
  .entrada-numero input { font-size: 28px; font-variant-numeric: tabular-nums; letter-spacing: 1px; padding: 10px 12px; }

  button { font: inherit; padding: 8px 14px; border: 1px solid var(--borde); border-radius: 6px; background: var(--superficie); color: var(--texto); cursor: pointer; }
  button:hover { background: var(--fondo); }
  button.principal { background: var(--primario); border-color: var(--primario); color: #fff; font-weight: 600; }
  button.principal:hover { background: var(--primario-oscuro); }
  .entrada-numero button.principal { padding: 14px 18px; }
  .botones { display: flex; flex-wrap: wrap; gap: 8px; }
  button:disabled { opacity: .6; cursor: default; }

  .cifras { display: flex; gap: 16px; margin-bottom: 8px; }
  .cifras div { flex: 1; }
  .cifras strong { display: block; font-size: 28px; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .cifras .alerta strong { color: var(--error); }
  #pendientes { margin: 0; font-weight: 600; color: var(--primario); }
  #recientes, #errores { list-style: none; margin: 0; padding: 0; font-size: 14px; }
  #recientes li, #errores li { padding: 6px 0; border-top: 1px solid var(--borde); }
  #recientes li:first-child, #errores li:first-child { border-top: 0; }
  #recientes .hora { color: var(--suave); font-variant-numeric: tabular-nums; margin-right: 6px; }
  #recientes li::before { content: "✓ "; color: var(--ok); font-weight: 700; }
  #zona-errores { border-color: #fecdca; }
  #zona-errores h2 { color: var(--error); }
  #errores li::before { content: "✗ "; color: var(--error); font-weight: 700; }
  #errores button { display: block; margin-top: 6px; font-size: 14px; }
  .vacio { color: var(--suave); font-size: 14px; margin: 0; }

  .consultas-barra { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; margin-bottom: 8px; }
  .consultas-barra form { display: flex; gap: 8px; align-items: flex-end; margin-left: auto; }
  .consultas-barra label.casilla { display: flex; gap: 6px; align-items: center; color: var(--texto); }
  .consultas-barra label.casilla input { width: auto; }
  #resultados { overflow-x: auto; }
  #resultados h3 { font-size: 16px; margin: 20px 0 8px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--borde); white-space: nowrap; }
  th { position: sticky; top: 0; background: var(--fondo); font-weight: 600; }
  tbody tr:nth-child(even) { background: #fafbfc; }
  table.fija { table-layout: fixed; }
  table.fija td { overflow: hidden; text-overflow: ellipsis; }
  tr.vencida td { background: var(--error-fondo); }
  tr.vencida td:last-child { color: var(--error); font-weight: 600; }

  #impresion { display: none; }
  @media print {
    body { background: #fff; }
    body > *:not(#impresion) { display: none !important; }
    #impresion { display: block; font-size: 12pt; }
    #impresion h1 { font-size: 16pt; margin: 0 0 12pt; }
    #impresion dl { display: grid; grid-template-columns: max-content 1fr; gap: 4pt 12pt; margin: 0 0 12pt; }
    #impresion dt { font-weight: 600; }
    #impresion dd { margin: 0; }
    #impresion th, #impresion td { border: 1px solid #000; white-space: normal; background: none; }
    #impresion .firma { display: grid; grid-template-columns: 1fr 1fr; gap: 24pt; margin-top: 48pt; }
    #impresion .firma p { border-top: 1px solid #000; padding-top: 4pt; margin: 0; }
  }
</style>
</head>
<body data-pestana="salida">
<header>
  <h1>¿Dónde está la historia?</h1>
  <div role="tablist" aria-label="Secciones">
    <button role="tab" id="tab-salida" aria-selected="true" onclick="mostrar('salida')">Salida</button>
    <button role="tab" id="tab-devolucion" aria-selected="false" tabindex="-1" onclick="mostrar('devolucion')">Devolución</button>
    <button role="tab" id="tab-seguimiento" aria-selected="false" tabindex="-1" onclick="mostrar('seguimiento')">Seguimiento</button>
    <button role="tab" id="tab-consultas" aria-selected="false" tabindex="-1" onclick="mostrar('consultas')">Consultas</button>
  </div>
</header>

<div class="contenido">
  <main class="panel">
    <p id="mensaje" role="status" aria-live="polite"></p>

    <form id="salida" onsubmit="registrarSalida(event)">
      <fieldset>
        <legend>Cargo en curso</legend>
        <div class="campos">
          <label>Servicio que solicita <select name="servicio" required onchange="servicioCambiado()"></select></label>
          <label>Persona autorizada que recibe (nombre y apellido completos)
            <input name="persona" required autocomplete="off"></label>
          <label>Motivo del préstamo <select name="tipo" required onchange="tipoCambiado()"></select></label>
          <label id="campo-fecha" hidden>Fecha de devolución <input name="fechaManual" type="date"></label>
        </div>
        <p class="ayuda" id="plazo-motivo"></p>
      </fieldset>
      <div class="entrada-numero">
        <label>Número de historia <input name="numero" required autocomplete="off" inputmode="text"></label>
        <button class="principal">Registrar salida</button>
      </div>
    </form>

    <form id="devolucion" hidden onsubmit="registrarDevolucion(event)">
      <fieldset>
        <legend>Integridad de la historia devuelta</legend>
        <div class="campos">
          <label>Integridad
            <select name="integridad"><option>conforme</option><option>con observaciones</option></select></label>
          <label>Observación (sin datos del paciente) <input name="observacion" autocomplete="off"></label>
        </div>
      </fieldset>
      <div class="entrada-numero">
        <label>Número de historia <input name="numero" required autocomplete="off"></label>
        <button class="principal">Registrar devolución</button>
      </div>
    </form>

    <form id="seguimiento" hidden onsubmit="registrarSeguimiento(event)">
      <fieldset>
        <legend>Acción</legend>
        <div class="campos">
          <label>Acción
            <select name="accion" onchange="accionCambiada()">
              <option value="cambiarTipo">Cambio de motivo</option>
              <option value="registrarEgreso">Egreso o fin de la observación</option>
              <option value="registrarRetencion">Retención justificada</option>
            </select></label>
          <label data-accion="cambiarTipo">Nuevo motivo <select name="tipo"></select></label>
          <label data-accion="registrarEgreso" hidden>Fecha y hora del egreso o del fin de la observación
            <input name="egreso" type="datetime-local"></label>
          <label data-accion="registrarRetencion" hidden>Motivo (sin datos del paciente) <input name="motivo" autocomplete="off"></label>
          <label data-accion="registrarRetencion" hidden>Nueva fecha de devolución <input name="fecha" type="date"></label>
        </div>
      </fieldset>
      <div class="entrada-numero">
        <label>Número de historia <input name="numero" required autocomplete="off"></label>
        <button class="principal">Registrar</button>
      </div>
    </form>

    <div id="consultas" hidden>
      <div class="consultas-barra">
        <button type="button" class="principal" onclick="verFuera()">Fuera ahora</button>
        <label class="casilla"><input type="checkbox" id="solo-vencidas"> Solo vencidas</label>
        <button type="button" onclick="verCumplimiento()">Cumplimiento por semana</button>
        <form onsubmit="verHistorial(event)">
          <label>Historial de un número <input name="numero" required autocomplete="off"></label>
          <button>Ver historial</button>
        </form>
      </div>
      <div id="resultados"></div>
    </div>
  </main>

  <aside class="lateral">
    <section class="tarjeta" id="zona-resumen">
      <h2>Resumen</h2>
      <div class="cifras">
        <div><strong id="cifra-fuera">—</strong><span id="texto-fuera">fuera</span></div>
        <div class="alerta"><strong id="cifra-vencidas">—</strong><span id="texto-vencidas">vencidas</span></div>
      </div>
      <p class="vacio" id="resumen-hora">Consultando…</p>
      <div class="botones" style="margin-top: 8px">
        <button type="button" onclick="actualizarResumen()">Actualizar</button>
        <button type="button" onclick="verVencidas()">Ver vencidas</button>
      </div>
    </section>

    <section class="tarjeta" id="zona-cargo">
      <h2>Cargo</h2>
      <p id="cargo-resumen" class="vacio">Sin historias.</p>
      <div class="botones" style="margin-top: 8px">
        <button type="button" onclick="imprimirCargo()">Imprimir cargo</button>
        <button type="button" onclick="nuevoCargo()">Nuevo cargo</button>
        <button type="button" onclick="reimprimirCargo()">Reimprimir cargo de hoy</button>
      </div>
    </section>

    <section class="tarjeta" id="zona-errores" hidden>
      <h2>No se registraron</h2>
      <ul id="errores"></ul>
      <button type="button" onclick="limpiarErrores()" style="margin-top: 8px">Limpiar lista</button>
    </section>

    <section class="tarjeta">
      <h2>Últimos registros</h2>
      <p id="pendientes"></p>
      <ul id="recientes"></ul>
      <p class="vacio" id="sin-recientes">Todavía no hay registros en esta sesión.</p>
    </section>
  </aside>
</div>

<div id="impresion"></div>

<script>
  var formas = {};
  var plazos = {};    // descripción del plazo de cada motivo
  var motivos = {};   // motivo habitual de cada servicio
  var cargo = [];     // salidas ya registradas del cargo actual
  var cola = [];      // registros por enviar, en el orden en que se escribieron
  var enviando = false;
  var PESTANAS = ['salida', 'devolucion', 'seguimiento', 'consultas'];

  google.script.run.withSuccessHandler(iniciar).withFailureHandler(error).configuracion();

  window.addEventListener('beforeunload', function (e) {
    if (cola.length) {
      e.preventDefault();
      e.returnValue = '';
    }
  });

  // Flechas izquierda y derecha para moverse entre pestañas.
  document.querySelector('[role=tablist]').addEventListener('keydown', function (e) {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    var actual = PESTANAS.indexOf(document.body.getAttribute('data-pestana'));
    var siguiente = PESTANAS[(actual + (e.key === 'ArrowRight' ? 1 : PESTANAS.length - 1)) % PESTANAS.length];
    mostrar(siguiente);
    document.getElementById('tab-' + siguiente).focus();
  });

  function iniciar(conf) {
    var f = document.getElementById('salida');
    conf.servicios.forEach(function (s) { f.servicio.add(new Option(s)); });
    var destino = document.getElementById('seguimiento').tipo;
    conf.tipos.forEach(function (t) {
      formas[t.nombre] = t.forma;
      plazos[t.nombre] = t.plazo;
      f.tipo.add(new Option(t.nombre));
      if (t.forma === 'horas_desde_alta') destino.add(new Option(t.nombre));
    });
    motivos = conf.motivos || {};
    servicioCambiado();
    f.numero.focus();
    actualizarResumen();
  }

  // Cuántas historias están fuera y cuántas vencidas. Se actualiza al abrir, con el botón y al terminar cada tanda.
  function actualizarResumen() {
    document.getElementById('resumen-hora').textContent = 'Consultando…';
    google.script.run.withFailureHandler(function (e) {
      document.getElementById('resumen-hora').textContent = 'No se pudo actualizar: ' + textoError(e);
    }).withSuccessHandler(function (r) {
      document.getElementById('cifra-fuera').textContent = r.fuera;
      document.getElementById('texto-fuera').textContent = 'fuera';
      document.getElementById('cifra-vencidas').textContent = r.vencidas;
      document.getElementById('texto-vencidas').textContent = r.vencidas === 1 ? 'vencida' : 'vencidas';
      document.getElementById('resumen-hora').textContent = 'Actualizado a las ' + r.hora + '.';
    }).resumenFuera();
  }

  function verVencidas() {
    mostrar('consultas');
    document.getElementById('solo-vencidas').checked = true;
    verFuera();
  }

  function mostrar(cual) {
    PESTANAS.forEach(function (id) {
      document.getElementById(id).hidden = id !== cual;
      var tab = document.getElementById('tab-' + id);
      tab.setAttribute('aria-selected', id === cual);
      tab.tabIndex = id === cual ? 0 : -1;
    });
    document.body.setAttribute('data-pestana', cual);
    document.getElementById('zona-cargo').hidden = cual !== 'salida';
    document.getElementById('zona-resumen').hidden = cual !== 'salida';
    document.getElementById('resultados').replaceChildren();
    avisar('', true);
    var numero = document.getElementById(cual).querySelector('[name=numero]');
    numero.focus();
  }

  // Muestra solo los campos de la acción elegida; el egreso se propone con la hora actual del Perú.
  function accionCambiada() {
    var f = document.getElementById('seguimiento');
    f.querySelectorAll('[data-accion]').forEach(function (campo) {
      campo.hidden = campo.getAttribute('data-accion') !== f.accion.value;
    });
    if (f.accion.value === 'registrarEgreso' && !f.egreso.value) {
      f.egreso.value = new Date(Date.now() - 5 * 3600000).toISOString().slice(0, 16);
    }
  }

  function registrarSeguimiento(evento) {
    evento.preventDefault();
    var f = evento.target;
    var datos = { numero: f.numero.value, tipo: f.tipo.value, egreso: f.egreso.value,
      motivo: f.motivo.value, fecha: f.fecha.value };
    google.script.run.withFailureHandler(error).withSuccessHandler(function (mensaje) {
      avisar(mensaje, true);
      anotarReciente(mensaje);
      f.numero.value = '';
      f.motivo.value = '';
      f.fecha.value = '';
      f.egreso.value = '';
      accionCambiada();
      f.numero.focus();
    })[f.accion.value](datos);
  }

  function verFuera() {
    avisar('Consultando…', true);
    google.script.run.withFailureHandler(error).withSuccessHandler(function (fuera) {
      var soloVencidas = document.getElementById('solo-vencidas').checked;
      var lista = fuera.filter(function (p) { return !soloVencidas || p.vencida; });
      var vencidas = fuera.filter(function (p) { return p.vencida; }).length;
      avisar(cantidad(fuera.length, 'historia fuera', 'historias fuera') + ', ' + cantidad(vencidas, 'vencida', 'vencidas') + '.', true);
      var zona = document.getElementById('resultados');
      zona.replaceChildren();
      var servicios = lista.map(function (p) { return p.servicio; })
        .filter(function (s, i, todos) { return todos.indexOf(s) === i; });
      servicios.forEach(function (servicio) {
        var delServicio = lista.filter(function (p) { return p.servicio === servicio; });
        agregar(zona, 'h3', servicio + ' (' + delServicio.length + ')');
        // Mismos anchos de columna en todos los servicios, para que las tablas se alineen.
        tabla(zona, ['Número', 'Persona', 'Motivo', 'Salida', 'Fecha límite', 'Estado'], delServicio.map(function (p) {
          return { celdas: [p.numero, p.persona, p.tipo, p.salida, p.limite, p.estado],
            clase: p.vencida ? 'vencida' : '' };
        })).className = 'fija';
      });
    }).fueraAhora();
  }

  // Por semana: ingresos al archivo, cuántos llegaron sin salida registrada y el porcentaje con salida registrada.
  function verCumplimiento() {
    google.script.run.withFailureHandler(error).withSuccessHandler(function (semanas) {
      var zona = document.getElementById('resultados');
      zona.replaceChildren();
      avisar('Últimas ' + semanas.length + ' semanas, de lunes a domingo.', true);
      tabla(zona, ['Semana del', 'Ingresos', 'Sin salida registrada', 'Con salida registrada'], semanas.map(function (s) {
        var partes = s.semana.split('-');
        return { celdas: [partes[2] + '/' + partes[1] + '/' + partes[0], s.ingresos, s.sinSalida,
          s.ingresos ? Math.round(100 * (s.ingresos - s.sinSalida) / s.ingresos) + ' %' : '—'], clase: '' };
      }));
    }).cumplimientoSemanal();
  }

  function verHistorial(evento) {
    evento.preventDefault();
    var numero = evento.target.numero.value;
    google.script.run.withFailureHandler(error).withSuccessHandler(function (filas) {
      var zona = document.getElementById('resultados');
      zona.replaceChildren();
      avisar(filas.length ? cantidad(filas.length, 'préstamo', 'préstamos') + ' de la historia ' + numero + '.' : 'La historia ' + numero + ' no tiene préstamos registrados.', true);
      if (!filas.length) return;
      tabla(zona, ['Salida', 'Servicio', 'Persona', 'Motivo', 'Entrega', 'Egreso', 'Fecha límite', 'Retención',
        'Devolución', 'Recibe', 'Integridad'], filas.map(function (r) {
        return { celdas: [r.salida, r.servicio, r.persona, r.tipo, r.entrega, r.egreso, r.limite, r.retencion,
          r.devolucion || 'sin devolver', r.recibe, r.integridad], clase: '' };
      }));
    }).historial(numero);
  }

  // Tabla con nodos de texto, sin HTML, porque incluye datos escritos por los usuarios.
  function tabla(zona, cabeceras, filas) {
    var t = agregar(zona, 'table');
    var cabecera = agregar(agregar(t, 'thead'), 'tr');
    cabeceras.forEach(function (c) { agregar(cabecera, 'th', c); });
    var cuerpo = agregar(t, 'tbody');
    filas.forEach(function (f) {
      var fila = agregar(cuerpo, 'tr');
      if (f.clase) fila.className = f.clase;
      f.celdas.forEach(function (c) { agregar(fila, 'td', String(c)); });
    });
    return t;
  }

  function cantidad(n, singular, plural) {
    return n + ' ' + (n === 1 ? singular : plural);
  }

  function agregar(padre, etiqueta, contenido) {
    var nodo = document.createElement(etiqueta);
    if (contenido !== undefined) nodo.textContent = contenido;
    padre.appendChild(nodo);
    return nodo;
  }

  // Al elegir el servicio se propone su motivo habitual; se puede cambiar.
  function servicioCambiado() {
    var f = document.getElementById('salida');
    if (motivos[f.servicio.value]) f.tipo.value = motivos[f.servicio.value];
    tipoCambiado();
  }

  function tipoCambiado() {
    var f = document.getElementById('salida');
    document.getElementById('plazo-motivo').textContent = plazos[f.tipo.value] || '';
    var manual = formas[f.tipo.value] === 'manual';
    document.getElementById('campo-fecha').hidden = !manual;
    f.fechaManual.required = manual;
  }

  // Servicio y persona del cargo actual: los de su primera salida, registrada o en cola.
  function loteActual() {
    var enCola = cola.filter(function (t) { return t.funcion === 'registrarSalida'; })[0];
    return cargo[0] || (enCola && enCola.datos) || null;
  }

  function salidasEnCola() {
    return cola.some(function (t) { return t.funcion === 'registrarSalida'; });
  }

  function registrarSalida(evento) {
    evento.preventDefault();
    var f = evento.target;
    var datos = { numero: f.numero.value, servicio: f.servicio.value, persona: f.persona.value.trim(),
      tipo: f.tipo.value, fechaManual: f.fechaManual.value };
    var lote = loteActual();
    if (lote && (lote.servicio !== datos.servicio || lote.persona !== datos.persona)) {
      return avisar('El cargo es de ' + lote.servicio + ' y ' + lote.persona +
        '. Imprímalo o inicie un nuevo cargo antes de cambiar de servicio o de persona.', false);
    }
    encolar('registrarSalida', datos, function (r) {
      cargo.push(r);
      resumirCargo();
      return 'Salida registrada: ' + r.numero + '. Fecha límite: ' + r.limite + '.';
    });
    f.numero.value = '';
    f.numero.focus();
  }

  function registrarDevolucion(evento) {
    evento.preventDefault();
    var f = evento.target;
    var datos = { numero: f.numero.value, integridad: f.integridad.value, observacion: f.observacion.value };
    encolar('registrarDevolucion', datos, function (r) {
      return 'Devolución registrada: ' + r.numero + ' (' + r.servicio + ')' +
        (r.vencida ? '. Se devolvió después de la fecha límite.' : '.');
    });
    f.numero.value = '';
    f.integridad.value = 'conforme';
    f.observacion.value = '';
    f.numero.focus();
  }

  // Los registros se envían de uno en uno, en orden, sin bloquear la página.
  function encolar(funcion, datos, alTerminar) {
    cola.push({ funcion: funcion, datos: datos, alTerminar: alTerminar });
    mostrarPendientes();
    enviarSiguiente();
  }

  function enviarSiguiente() {
    if (enviando || !cola.length) return;
    enviando = true;
    var tarea = cola[0];
    google.script.run
      .withSuccessHandler(function (r) {
        var texto = tarea.alTerminar(r);
        avisar(texto, true);
        anotarReciente(texto);
        terminar();
      })
      .withFailureHandler(function (e) { anotarError(tarea, e); terminar(); })
      [tarea.funcion](tarea.datos);
  }

  function terminar() {
    cola.shift();
    enviando = false;
    mostrarPendientes();
    if (!cola.length) actualizarResumen();
    enviarSiguiente();
  }

  function mostrarPendientes() {
    document.getElementById('pendientes').textContent = cola.length ? 'Por registrar: ' + cola.length + '.' : '';
  }

  // Los últimos 8 registros exitosos, el más reciente arriba, con su hora.
  function anotarReciente(texto) {
    var lista = document.getElementById('recientes');
    var item = document.createElement('li');
    agregar(item, 'span', new Date().toLocaleTimeString('es-PE', { hour: '2-digit', minute: '2-digit' })).className = 'hora';
    item.appendChild(document.createTextNode(texto));
    lista.insertBefore(item, lista.firstChild);
    while (lista.children.length > 8) lista.lastChild.remove();
    document.getElementById('sin-recientes').hidden = true;
  }

  // Una devolución de una historia que no figura prestada puede registrarse como ingreso sin salida registrada.
  function anotarError(tarea, e) {
    var mensaje = textoError(e);
    avisar(tarea.datos.numero + ': ' + mensaje, false);
    var item = agregar(document.getElementById('errores'), 'li', tarea.datos.numero + ': ' + mensaje + ' ');
    if (tarea.funcion === 'registrarDevolucion' && /no figura prestada/.test(mensaje)) {
      var boton = agregar(item, 'button', 'Registrar como ingreso sin salida registrada');
      boton.type = 'button';
      boton.onclick = function () {
        boton.disabled = true;
        google.script.run.withSuccessHandler(function (texto) {
          avisar(texto, true);
          anotarReciente(texto);
          item.remove();
          if (!document.getElementById('errores').children.length) limpiarErrores();
        }).withFailureHandler(function (e2) {
          boton.disabled = false;
          error(e2);
        }).registrarIngresoSinSalida(tarea.datos);
      };
    }
    document.getElementById('zona-errores').hidden = false;
  }

  function limpiarErrores() {
    document.getElementById('errores').replaceChildren();
    document.getElementById('zona-errores').hidden = true;
  }

  function resumirCargo() {
    var resumen = document.getElementById('cargo-resumen');
    resumen.textContent = cargo.length
      ? cantidad(cargo.length, 'historia', 'historias') + ' para ' + cargo[0].servicio + ', recibe ' + cargo[0].persona + '.'
      : 'Sin historias.';
    resumen.className = cargo.length ? '' : 'vacio';
  }

  function nuevoCargo() {
    if (salidasEnCola()) return avisar('Espere a que terminen de registrarse las salidas pendientes.', false);
    cargo = [];
    resumirCargo();
  }

  function imprimirCargo() {
    if (salidasEnCola()) return avisar('Espere a que terminen de registrarse las salidas pendientes.', false);
    if (!cargo.length) return avisar('El cargo no tiene historias.', false);
    imprimir(cargo);
  }

  // Arma el cargo desde la hoja con las salidas de hoy del servicio y la persona del formulario.
  function reimprimirCargo() {
    var f = document.getElementById('salida');
    var servicio = f.servicio.value;
    var persona = f.persona.value.trim();
    if (!persona) return avisar('Escriba el nombre de la persona que recibió las historias.', false);
    google.script.run.withFailureHandler(error).withSuccessHandler(function (filas) {
      if (!filas.length) return avisar('No hay salidas de hoy para ' + servicio + ' y ' + persona + '.', false);
      imprimir(filas);
    }).cargoDeHoy(servicio, persona);
  }

  // Arma el cargo con nodos de texto, sin HTML, porque incluye el nombre escrito por el usuario.
  function imprimir(filas) {
    var zona = document.getElementById('impresion');
    zona.replaceChildren();
    var entregas = filas.map(function (r) { return r.entrega; })
      .filter(function (e, i, todas) { return todas.indexOf(e) === i; });
    agregar(zona, 'h1', 'Cargo de salida de historias clínicas');
    var datos = agregar(zona, 'dl');
    [['Servicio', filas[0].servicio], ['Recibe', filas[0].persona], ['Entrega', entregas.join(', ')],
      ['Impreso', new Date().toLocaleString('es-PE', { timeZone: 'America/Lima', dateStyle: 'short', timeStyle: 'short' })],
      ['Total', cantidad(filas.length, 'historia', 'historias')]].forEach(function (par) {
      agregar(datos, 'dt', par[0]);
      agregar(datos, 'dd', par[1]);
    });
    tabla(zona, ['N.°', 'Número de historia', 'Salida', 'Fecha límite'], filas.map(function (r, i) {
      return { celdas: [i + 1, r.numero, r.salida, r.limite], clase: '' };
    }));
    var firma = agregar(zona, 'div');
    firma.className = 'firma';
    agregar(firma, 'p', 'Firma de quien recibe');
    agregar(firma, 'p', 'Fecha y hora de recepción');
    window.print();
  }

  function avisar(texto, ok) {
    var m = document.getElementById('mensaje');
    m.textContent = texto;
    m.className = ok ? 'ok' : 'error';
  }

  function error(e) {
    avisar(textoError(e), false);
  }

  // Apps Script antepone «Error: » al mensaje de las excepciones del servidor.
  function textoError(e) {
    return String((e && e.message) || e).replace(/^Error:\s*/, '');
  }
</script>
</body>
</html>
