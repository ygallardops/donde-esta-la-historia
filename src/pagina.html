<!DOCTYPE html>
<html lang="es-PE">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  body { font: 16px system-ui, sans-serif; margin: 16px; max-width: 720px; }
  [hidden] { display: none !important; }
  button { font-size: 16px; padding: 6px 12px; }
  [role=tab] { font-size: 16px; padding: 8px 16px; }
  [role=tab][aria-selected=true] { font-weight: bold; border-bottom: 3px solid; }
  label { display: block; margin: 8px 0; }
  input, select { font-size: 16px; padding: 6px; width: 100%; box-sizing: border-box; }
  #mensaje { padding: 8px; min-height: 1.5em; }
  .ok { background: #e6f4ea; }
  .error { background: #fce8e6; }
  #errores li { background: #fce8e6; margin: 4px 0; padding: 4px; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border: 1px solid #666; padding: 4px; text-align: left; }
  .vencida { background: #fce8e6; }
  #resultados { overflow-x: auto; }
  #impresion { display: none; }
  @media print {
    body > *:not(#impresion) { display: none; }
    #impresion { display: block; }
  }
</style>
</head>
<body>
<h1>¿Dónde está la historia?</h1>
<div role="tablist">
  <button role="tab" id="tab-salida" aria-selected="true" onclick="mostrar('salida')">Salida</button>
  <button role="tab" id="tab-devolucion" aria-selected="false" onclick="mostrar('devolucion')">Devolución</button>
  <button role="tab" id="tab-seguimiento" aria-selected="false" onclick="mostrar('seguimiento')">Seguimiento</button>
  <button role="tab" id="tab-consultas" aria-selected="false" onclick="mostrar('consultas')">Consultas</button>
</div>
<p id="mensaje" role="status" aria-live="polite"></p>
<p id="pendientes"></p>
<div id="zona-errores" hidden>
  <h2>No se registraron</h2>
  <ul id="errores"></ul>
  <button type="button" onclick="limpiarErrores()">Limpiar lista</button>
</div>

<form id="salida" onsubmit="registrarSalida(event)">
  <label>Servicio <select name="servicio" required></select></label>
  <label>Persona autorizada que recibe (nombre y apellido completos)
    <input name="persona" required autocomplete="off"></label>
  <label>Tipo de préstamo <select name="tipo" required onchange="tipoCambiado()"></select></label>
  <label id="campo-fecha" hidden>Fecha de devolución <input name="fechaManual" type="date"></label>
  <label>Número de historia <input name="numero" required autocomplete="off"></label>
  <button>Registrar salida</button>
  <h2>Cargo</h2>
  <p id="cargo-resumen">Sin historias.</p>
  <button type="button" onclick="imprimirCargo()">Imprimir cargo</button>
  <button type="button" onclick="nuevoCargo()">Nuevo cargo</button>
  <button type="button" onclick="reimprimirCargo()">Reimprimir cargo de hoy</button>
</form>

<form id="devolucion" hidden onsubmit="registrarDevolucion(event)">
  <label>Integridad
    <select name="integridad"><option>conforme</option><option>con observaciones</option></select></label>
  <label>Observación (sin datos del paciente) <input name="observacion" autocomplete="off"></label>
  <label>Número de historia <input name="numero" required autocomplete="off"></label>
  <button>Registrar devolución</button>
</form>

<form id="seguimiento" hidden onsubmit="registrarSeguimiento(event)">
  <label>Número de historia <input name="numero" required autocomplete="off"></label>
  <label>Acción
    <select name="accion" onchange="accionCambiada()">
      <option value="cambiarTipo">Cambio de tipo</option>
      <option value="registrarEgreso">Egreso o fin de la observación</option>
      <option value="registrarRetencion">Retención justificada</option>
    </select></label>
  <label data-accion="cambiarTipo">Nuevo tipo <select name="tipo"></select></label>
  <label data-accion="registrarEgreso" hidden>Fecha y hora del egreso o del fin de la observación
    <input name="egreso" type="datetime-local"></label>
  <label data-accion="registrarRetencion" hidden>Motivo (sin datos del paciente) <input name="motivo" autocomplete="off"></label>
  <label data-accion="registrarRetencion" hidden>Nueva fecha de devolución <input name="fecha" type="date"></label>
  <button>Registrar</button>
</form>

<div id="consultas" hidden>
  <button type="button" onclick="verFuera()">Fuera ahora</button>
  <label><input type="checkbox" id="solo-vencidas" style="width:auto"> Solo vencidas</label>
  <form onsubmit="verHistorial(event)">
    <label>Número de historia <input name="numero" required autocomplete="off"></label>
    <button>Ver historial</button>
  </form>
</div>
<div id="resultados"></div>

<div id="impresion"></div>

<script>
  var formas = {};
  var cargo = [];     // salidas ya registradas del cargo actual
  var cola = [];      // registros por enviar, en el orden en que se escribieron
  var enviando = false;

  google.script.run.withSuccessHandler(iniciar).withFailureHandler(error).configuracion();

  window.addEventListener('beforeunload', function (e) {
    if (cola.length) {
      e.preventDefault();
      e.returnValue = '';
    }
  });

  function iniciar(conf) {
    var f = document.getElementById('salida');
    conf.servicios.forEach(function (s) { f.servicio.add(new Option(s)); });
    var destino = document.getElementById('seguimiento').tipo;
    conf.tipos.forEach(function (t) {
      formas[t.nombre] = t.forma;
      f.tipo.add(new Option(t.nombre));
      if (t.forma === 'horas_desde_alta') destino.add(new Option(t.nombre));
    });
    tipoCambiado();
    f.numero.focus();
  }

  function mostrar(cual) {
    ['salida', 'devolucion', 'seguimiento', 'consultas'].forEach(function (id) {
      document.getElementById(id).hidden = id !== cual;
      document.getElementById('tab-' + id).setAttribute('aria-selected', id === cual);
    });
    document.getElementById('resultados').replaceChildren();
    var numero = document.getElementById(cual).querySelector('[name=numero]');
    numero.focus();
  }

  // Muestra solo los campos de la acción elegida; el egreso se propone con la hora actual del Perú.
  function accionCambiada() {
    var f = document.getElementById('seguimiento');
    f.querySelectorAll('[data-accion]').forEach(function (campo) {
      campo.hidden = campo.getAttribute('data-accion') !== f.accion.value;
    });
    if (f.accion.value === 'registrarEgreso' && !f.egreso.value) {
      f.egreso.value = new Date(Date.now() - 5 * 3600000).toISOString().slice(0, 16);
    }
  }

  function registrarSeguimiento(evento) {
    evento.preventDefault();
    var f = evento.target;
    var datos = { numero: f.numero.value, tipo: f.tipo.value, egreso: f.egreso.value,
      motivo: f.motivo.value, fecha: f.fecha.value };
    google.script.run.withFailureHandler(error).withSuccessHandler(function (mensaje) {
      avisar(mensaje, true);
      f.numero.value = '';
      f.motivo.value = '';
      f.fecha.value = '';
      f.egreso.value = '';
      accionCambiada();
      f.numero.focus();
    })[f.accion.value](datos);
  }

  function verFuera() {
    avisar('Consultando…', true);
    google.script.run.withFailureHandler(error).withSuccessHandler(function (fuera) {
      var soloVencidas = document.getElementById('solo-vencidas').checked;
      var lista = fuera.filter(function (p) { return !soloVencidas || p.vencida; });
      var vencidas = fuera.filter(function (p) { return p.vencida; }).length;
      avisar(cantidad(fuera.length, 'historia fuera', 'historias fuera') + ', ' + cantidad(vencidas, 'vencida', 'vencidas') + '.', true);
      var zona = document.getElementById('resultados');
      zona.replaceChildren();
      var servicios = lista.map(function (p) { return p.servicio; })
        .filter(function (s, i, todos) { return todos.indexOf(s) === i; });
      servicios.forEach(function (servicio) {
        var delServicio = lista.filter(function (p) { return p.servicio === servicio; });
        agregar(zona, 'h3', servicio + ' (' + delServicio.length + ')');
        tabla(zona, ['Número', 'Persona', 'Tipo', 'Salida', 'Fecha límite'], delServicio.map(function (p) {
          return { celdas: [p.numero, p.persona, p.tipo, p.salida, p.limite + (p.vencida ? ' (vencida)' : '')],
            clase: p.vencida ? 'vencida' : '' };
        }));
      });
    }).fueraAhora();
  }

  function verHistorial(evento) {
    evento.preventDefault();
    var numero = evento.target.numero.value;
    google.script.run.withFailureHandler(error).withSuccessHandler(function (filas) {
      var zona = document.getElementById('resultados');
      zona.replaceChildren();
      avisar(filas.length ? cantidad(filas.length, 'préstamo', 'préstamos') + ' de la historia ' + numero + '.' : 'La historia ' + numero + ' no tiene préstamos registrados.', true);
      if (!filas.length) return;
      tabla(zona, ['Salida', 'Servicio', 'Persona', 'Tipo', 'Entrega', 'Egreso', 'Fecha límite', 'Retención',
        'Devolución', 'Recibe', 'Integridad'], filas.map(function (r) {
        return { celdas: [r.salida, r.servicio, r.persona, r.tipo, r.entrega, r.egreso, r.limite, r.retencion,
          r.devolucion || 'sin devolver', r.recibe, r.integridad], clase: '' };
      }));
    }).historial(numero);
  }

  // Tabla con nodos de texto, sin HTML, porque incluye datos escritos por los usuarios.
  function tabla(zona, cabeceras, filas) {
    var t = agregar(zona, 'table');
    var cabecera = agregar(t, 'tr');
    cabeceras.forEach(function (c) { agregar(cabecera, 'th', c); });
    filas.forEach(function (f) {
      var fila = agregar(t, 'tr');
      if (f.clase) fila.className = f.clase;
      f.celdas.forEach(function (c) { agregar(fila, 'td', String(c)); });
    });
  }

  function cantidad(n, singular, plural) {
    return n + ' ' + (n === 1 ? singular : plural);
  }

  function agregar(padre, etiqueta, contenido) {
    var nodo = document.createElement(etiqueta);
    if (contenido !== undefined) nodo.textContent = contenido;
    padre.appendChild(nodo);
    return nodo;
  }

  function tipoCambiado() {
    var f = document.getElementById('salida');
    var manual = formas[f.tipo.value] === 'manual';
    document.getElementById('campo-fecha').hidden = !manual;
    f.fechaManual.required = manual;
  }

  // Servicio y persona del cargo actual: los de su primera salida, registrada o en cola.
  function loteActual() {
    var enCola = cola.filter(function (t) { return t.funcion === 'registrarSalida'; })[0];
    return cargo[0] || (enCola && enCola.datos) || null;
  }

  function salidasEnCola() {
    return cola.some(function (t) { return t.funcion === 'registrarSalida'; });
  }

  function registrarSalida(evento) {
    evento.preventDefault();
    var f = evento.target;
    var datos = { numero: f.numero.value, servicio: f.servicio.value, persona: f.persona.value.trim(),
      tipo: f.tipo.value, fechaManual: f.fechaManual.value };
    var lote = loteActual();
    if (lote && (lote.servicio !== datos.servicio || lote.persona !== datos.persona)) {
      return avisar('El cargo es de ' + lote.servicio + ' y ' + lote.persona +
        '. Imprímalo o inicie un nuevo cargo antes de cambiar de servicio o de persona.', false);
    }
    encolar('registrarSalida', datos, function (r) {
      cargo.push(r);
      resumirCargo();
      return 'Salida registrada: ' + r.numero + '. Fecha límite: ' + r.limite + '.';
    });
    f.numero.value = '';
    f.numero.focus();
  }

  function registrarDevolucion(evento) {
    evento.preventDefault();
    var f = evento.target;
    var datos = { numero: f.numero.value, integridad: f.integridad.value, observacion: f.observacion.value };
    encolar('registrarDevolucion', datos, function (r) {
      return 'Devolución registrada: ' + r.numero + ' (' + r.servicio + ')' +
        (r.vencida ? '. Se devolvió después de la fecha límite.' : '.');
    });
    f.numero.value = '';
    f.integridad.value = 'conforme';
    f.observacion.value = '';
    f.numero.focus();
  }

  // Los registros se envían de uno en uno, en orden, sin bloquear la página.
  function encolar(funcion, datos, alTerminar) {
    cola.push({ funcion: funcion, datos: datos, alTerminar: alTerminar });
    mostrarPendientes();
    enviarSiguiente();
  }

  function enviarSiguiente() {
    if (enviando || !cola.length) return;
    enviando = true;
    var tarea = cola[0];
    google.script.run
      .withSuccessHandler(function (r) { avisar(tarea.alTerminar(r), true); terminar(); })
      .withFailureHandler(function (e) { anotarError(tarea.datos.numero, e); terminar(); })
      [tarea.funcion](tarea.datos);
  }

  function terminar() {
    cola.shift();
    enviando = false;
    mostrarPendientes();
    enviarSiguiente();
  }

  function mostrarPendientes() {
    document.getElementById('pendientes').textContent = cola.length ? 'Por registrar: ' + cola.length + '.' : '';
  }

  function anotarError(numero, e) {
    var item = document.createElement('li');
    item.textContent = numero + ': ' + (e.message || String(e));
    document.getElementById('errores').appendChild(item);
    document.getElementById('zona-errores').hidden = false;
  }

  function limpiarErrores() {
    document.getElementById('errores').replaceChildren();
    document.getElementById('zona-errores').hidden = true;
  }

  function resumirCargo() {
    document.getElementById('cargo-resumen').textContent = cargo.length
      ? cantidad(cargo.length, 'historia', 'historias') + ' para ' + cargo[0].servicio + ', recibe ' + cargo[0].persona + '.'
      : 'Sin historias.';
  }

  function nuevoCargo() {
    if (salidasEnCola()) return avisar('Espere a que terminen de registrarse las salidas pendientes.', false);
    cargo = [];
    resumirCargo();
  }

  function imprimirCargo() {
    if (salidasEnCola()) return avisar('Espere a que terminen de registrarse las salidas pendientes.', false);
    if (!cargo.length) return avisar('El cargo no tiene historias.', false);
    imprimir(cargo);
  }

  // Arma el cargo desde la hoja con las salidas de hoy del servicio y la persona del formulario.
  function reimprimirCargo() {
    var f = document.getElementById('salida');
    var servicio = f.servicio.value;
    var persona = f.persona.value.trim();
    if (!persona) return avisar('Escriba el nombre de la persona que recibió las historias.', false);
    google.script.run.withFailureHandler(error).withSuccessHandler(function (filas) {
      if (!filas.length) return avisar('No hay salidas de hoy para ' + servicio + ' y ' + persona + '.', false);
      imprimir(filas);
    }).cargoDeHoy(servicio, persona);
  }

  // Arma el cargo con nodos de texto, sin HTML, porque incluye el nombre escrito por el usuario.
  function imprimir(filas) {
    var zona = document.getElementById('impresion');
    zona.replaceChildren();
    var entregas = filas.map(function (r) { return r.entrega; })
      .filter(function (e, i, todas) { return todas.indexOf(e) === i; });
    agregar(zona, 'h1', 'Cargo de salida de historias clínicas');
    agregar(zona, 'p', 'Servicio: ' + filas[0].servicio);
    agregar(zona, 'p', 'Entrega: ' + entregas.join(', '));
    agregar(zona, 'p', 'Recibe: ' + filas[0].persona);
    var tabla = agregar(zona, 'table');
    var cabecera = agregar(tabla, 'tr');
    ['N.°', 'Número de historia', 'Salida', 'Fecha límite'].forEach(function (t) { agregar(cabecera, 'th', t); });
    filas.forEach(function (r, i) {
      var fila = agregar(tabla, 'tr');
      [String(i + 1), r.numero, r.salida, r.limite].forEach(function (t) { agregar(fila, 'td', t); });
    });
    agregar(zona, 'p', 'Firma de quien recibe: ______________________________');
    window.print();
  }

  function avisar(texto, ok) {
    var m = document.getElementById('mensaje');
    m.textContent = texto;
    m.className = ok ? 'ok' : 'error';
  }

  function error(e) {
    avisar(e.message || String(e), false);
  }
</script>
</body>
</html>
